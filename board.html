<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090d17" />
    <link rel="icon" href="/images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/yapern.css" />
    <script type="module" src="/src/messages.js"></script>
    <script type="module" src="/src/auth-nav.js"></script>
    <script type="module" src="/src/create.js"></script>
    <title>Board · Yapern</title>
  </head>
  <body class="board-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header shell">
      <a class="brand" href="/" aria-label="Yapern home"
        ><img src="/images/logo.png" alt="" width="36" height="36" />yapern<span
          class="brand-dot"
          >.</span
        ></a
      >
      <nav aria-label="Main navigation">
        <a href="/#features">Features</a
        ><a href="/#communities">Sub-yaps &amp; moderators</a
        ><a href="/#open-source">Open source</a>
      </nav>
      <div class="header-actions">
        <div class="create-menu" id="create-menu" hidden>
          <button class="button button-small" id="create-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="create-options">
            <span aria-hidden="true">+</span> Create <span class="create-chevron" aria-hidden="true">⌄</span>
          </button>
          <div class="create-options" id="create-options" role="menu" aria-labelledby="create-toggle" hidden>
            <button type="button" role="menuitem" tabindex="-1" data-create="message">Create message</button>
            <button type="button" role="menuitem" tabindex="-1" data-create="board">Create board</button>
          </div>
        </div>
        <a class="button button-small" href="/login/" data-login-link>Login</a>
      </div>
    </header>
    <dialog class="create-dialog" id="create-message-dialog" aria-labelledby="create-message-heading">
      <header class="create-dialog-header">
        <span class="create-dialog-brand">yapern<span aria-hidden="true">.</span></span>
        <h2 id="create-message-heading">Create a message</h2>
        <button class="dialog-close" type="button" aria-label="Close create message" data-close-dialog>×</button>
      </header>
      <div class="create-dialog-layout">
        <form class="create-form" id="create-message-form">
          <label class="create-field" for="create-board">
            <span>Post to</span>
            <select id="create-board" name="board" required autofocus disabled><option value="">Loading boards…</option></select>
          </label>
          <div class="create-board-state">
            <p id="create-boards-status" role="status"></p>
            <button class="create-text-button" id="create-boards-retry" type="button" hidden>Retry</button>
          </div>
          <label class="create-field" for="create-title">
            <span>Title <span class="required-mark">(required)</span></span>
            <input id="create-title" name="title" type="text" required maxlength="200" placeholder="Give your message a title" />
          </label>
          <label class="create-field" for="create-body">
            <span>Message <span class="required-mark">(required)</span></span>
            <textarea id="create-body" name="body" rows="8" required maxlength="2000" aria-describedby="create-body-count" placeholder="Write your message"></textarea>
          </label>
          <p class="create-field-meta" id="create-body-count">0/2000</p>
          <p class="create-error" id="create-message-error" role="alert"></p>
          <div class="create-actions">
            <button class="create-secondary" type="button" data-close-dialog>Cancel</button>
            <button class="button button-small" type="submit" disabled>Post</button>
          </div>
        </form>
        <aside class="create-board-aside" id="create-selected-board" aria-label="Selected board" hidden>
          <h3 id="create-selected-name"></h3>
          <p id="create-selected-description"></p>
        </aside>
      </div>
    </dialog>
    <dialog class="create-board-dialog" id="create-board-dialog" aria-labelledby="create-board-heading">
      <header class="create-board-dialog-header">
        <h2 id="create-board-heading">Create new board</h2>
        <button class="dialog-close" type="button" aria-label="Close create board" data-close-dialog>×</button>
      </header>
      <form class="create-form" id="create-board-form">
        <label class="create-field" for="new-board-name">
          <span>Name <span class="required-mark">(required)</span></span>
          <input id="new-board-name" name="name" type="text" required maxlength="80" autofocus />
        </label>
        <label class="create-field" for="new-board-description">
          <span>Description</span>
          <textarea id="new-board-description" name="description" rows="4" maxlength="2000"></textarea>
        </label>
        <p class="create-error" id="create-board-error" role="alert"></p>
        <div class="create-actions">
          <button class="create-secondary" type="button" data-close-dialog>Cancel</button>
          <button class="button button-small" type="submit" disabled>Create board</button>
        </div>
      </form>
    </dialog>
    <main id="main" class="live-messages-section detail-board-layout shell">
      <aside class="detail-board-navigation" aria-label="Board navigation">
        <nav aria-label="Message views">
          <a class="detail-nav-link" href="/#messages-title">All messages</a>
        </nav>
        <details class="detail-board-menu" open>
          <summary>Boards</summary>
          <p id="boards-status" class="detail-sidebar-status" role="status">Loading boards…</p>
          <ul id="board-navigation" aria-label="Boards" aria-busy="true"></ul>
          <button id="boards-retry" class="messages-retry" type="button" hidden>Retry boards</button>
        </details>
      </aside>
      <section class="live-messages-feed" aria-labelledby="messages-title">
        <h1 id="messages-title">Board</h1>
        <p id="board-description" class="board-description"></p>
        <p id="messages-status" class="messages-status" role="status"></p>
        <button id="messages-retry" class="messages-retry" type="button" hidden>Try again</button>
        <ul id="live-messages" aria-labelledby="messages-title" aria-busy="false"></ul>
        <noscript><p class="messages-status">Enable JavaScript to read messages.</p></noscript>
      </section>
      <aside class="detail-recent-posts" aria-labelledby="recent-title">
        <h2 id="recent-title">Recent posts</h2>
        <p id="recent-status" class="detail-sidebar-status" role="status">Loading posts…</p>
        <ul id="recent-posts" aria-labelledby="recent-title" aria-busy="true"></ul>
        <button id="recent-retry" class="messages-retry" type="button" hidden>Retry recent posts</button>
      </aside>
    </main>
    <footer class="site-footer shell">
      <a class="brand footer-brand" href="/">yapern<span class="brand-dot">.</span></a>
      <nav aria-label="Footer"><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a></nav>
    </footer>
  </body>
</html>
